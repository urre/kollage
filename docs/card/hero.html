<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      .stage { width: 1280px; height: 880px; display: flex; align-items: center; justify-content: center; gap: 88px; }
      .item { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 26px; }
      .phone { width: 340px; height: 736px; }
      .caption { font-size: 25px; font-weight: 600; color: #8e8e93; letter-spacing: -0.01em; }
      .item:first-child { transform: rotate(-2.5deg); }
      .item:last-child { transform: rotate(2.5deg); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="item">
        <div class="phone"><img src="shot-grid.png" alt="" /></div>
        <div class="caption">Rutnät</div>
      </div>
      <div class="item">
        <div class="phone"><img src="shot-klippbok.png" alt="" /></div>
        <div class="caption">Klippbok</div>
      </div>
    </div>
  </body>
</html>
