<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0c0c0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kollage" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Kollage — make collages from your photos on your phone</title>
    <meta
      name="description"
      content="Make collages from your photos on your phone: grid, polaroid or scrapbook, pan and zoom each photo, save as PNG or JPG. Everything happens in the browser — your photos never leave the phone."
    />
    <link rel="canonical" href="https://urre.github.io/kollage/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph and Twitter want absolute URLs, so these cannot use the
         Vite base the way the tags above do. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kollage" />
    <meta property="og:locale" content="en" />
    <meta property="og:url" content="https://urre.github.io/kollage/" />
    <meta property="og:title" content="Kollage — make collages from your photos on your phone" />
    <meta
      property="og:description"
      content="Grid, polaroid or scrapbook. Pan and zoom each photo and save as PNG or JPG. Everything happens in the browser — your photos never leave the phone."
    />
    <meta property="og:image" content="https://urre.github.io/kollage/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kollage on two phones: a grid of four photos and a scrapbook page of taped prints." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kollage — make collages from your photos on your phone" />
    <meta
      name="twitter:description"
      content="Grid, polaroid or scrapbook. Pan and zoom each photo and save as PNG or JPG. Everything happens in the browser — your photos never leave the phone."
    />
    <meta name="twitter:image" content="https://urre.github.io/kollage/og.jpg" />
    <meta name="twitter:image:alt" content="Kollage on two phones: a grid of four photos and a scrapbook page of taped prints." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Kollage",
        "url": "https://urre.github.io/kollage/",
        "description": "Make collages from your photos on your phone: grid, polaroid or scrapbook, pan and zoom each photo, save as PNG or JPG. Everything happens in the browser — your photos never leave the phone.",
        "inLanguage": "en",
        "applicationCategory": "MultimediaApplication",
        "applicationSubCategory": "Photo collage",
        "operatingSystem": "iOS, Android, Windows, macOS",
        "browserRequirements": "Requires JavaScript and a modern browser",
        "image": "https://urre.github.io/kollage/og.jpg",
        "screenshot": "https://urre.github.io/kollage/og.jpg",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "SEK" },
        "author": { "@type": "Person", "name": "Urban Sandén", "url": "https://github.com/urre" },
        "featureList": [
          "Grid, polaroid and scrapbook",
          "Formats 9:16, 4:5, 1:1, 3:2 and 16:9",
          "Pan, zoom and black and white per photo",
          "Export to PNG or JPG at up to 3840×2160",
          "Runs entirely in the browser, with no account and no upload"
        ],
        "privacyPolicy": "https://github.com/urre/kollage#integritet"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
